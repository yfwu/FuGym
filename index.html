<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
<meta name="theme-color" content="#F3F5F7" media="(prefers-color-scheme: light)" />
<meta name="theme-color" content="#0F1215" media="(prefers-color-scheme: dark)" />
<meta name="apple-mobile-web-app-capable" content="yes" />
<meta name="apple-mobile-web-app-status-bar-style" content="default" />
<title>FuGym</title>
<style>
:root {
  color-scheme: light dark;
  --bg: #F3F5F7;
  --surface: #FFFFFF;
  --surface-2: #F0F3F6;
  --surface-3: #E3E8ED;
  --line: #E2E7EC;
  --text: #161B21;
  --text-2: #56616D;
  --text-3: #8D97A2;
  --accent: #139A9C;
  --accent-strong: #0C7E80;
  --accent-ink: #FFFFFF;
  --accent-soft: rgba(19, 154, 156, 0.12);
  --done: #2F9D5C;
  --done-ink: #FFFFFF;
  --done-soft: rgba(47, 157, 92, 0.11);
  --warn: #D9822B;
  --warn-soft: rgba(217, 130, 43, 0.16);
  --danger: #D0453A;
  --toast-bg: #1E252C;
  --toast-fg: #FFFFFF;
  --toast-act: #6FE3E1;
  --shadow: 0 1px 2px rgba(16, 24, 32, 0.05), 0 4px 14px rgba(16, 24, 32, 0.05);
  --shadow-lg: 0 -2px 24px rgba(16, 24, 32, 0.12);
  --r-lg: 18px;
  --safe-b: env(safe-area-inset-bottom, 0px);
  --font: system-ui, -apple-system, "SF Pro Text", "PingFang TC", "Noto Sans TC", "Microsoft JhengHei", sans-serif;
}
@media (prefers-color-scheme: dark) {
  :root {
    --bg: #0F1215;
    --surface: #181C21;
    --surface-2: #21272D;
    --surface-3: #2C333A;
    --line: #2A3138;
    --text: #E9EDF0;
    --text-2: #A6B0BA;
    --text-3: #6F7A85;
    --accent: #3CC6C4;
    --accent-strong: #5AD6D4;
    --accent-ink: #052324;
    --accent-soft: rgba(60, 198, 196, 0.14);
    --done: #42BE76;
    --done-ink: #04210F;
    --done-soft: rgba(66, 190, 118, 0.13);
    --warn: #F0A14E;
    --warn-soft: rgba(240, 161, 78, 0.16);
    --danger: #F06C60;
    --toast-bg: #E9EDF0;
    --toast-fg: #11161B;
    --toast-act: #0C7E80;
    --shadow: 0 0 0 1px rgba(255, 255, 255, 0.03);
    --shadow-lg: 0 -2px 24px rgba(0, 0, 0, 0.5);
  }
}

* { box-sizing: border-box; }
html { -webkit-text-size-adjust: 100%; }
body {
  margin: 0;
  background: var(--bg);
  color: var(--text);
  font-family: var(--font);
  font-size: 15px;
  line-height: 1.45;
  -webkit-font-smoothing: antialiased;
  -webkit-tap-highlight-color: transparent;
}
body.lock { overflow: hidden; }
button { font: inherit; color: inherit; background: none; border: 0; padding: 0; cursor: pointer; touch-action: manipulation; }
button:disabled { opacity: .4; cursor: default; }
input, textarea { font: inherit; color: inherit; }
:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
[hidden] { display: none !important; }
.ic { width: 20px; height: 20px; flex: none; stroke: currentColor; fill: none; stroke-width: 2; stroke-linecap: round; stroke-linejoin: round; }
.num { font-variant-numeric: tabular-nums; }
.muted { color: var(--text-3); }
.wrap { max-width: 640px; margin: 0 auto; padding: 0 16px; }

/* App bar */
.appbar {
  position: sticky; top: 0; z-index: 20;
  background: var(--bg);
  background: color-mix(in srgb, var(--bg) 86%, transparent);
  -webkit-backdrop-filter: saturate(1.6) blur(14px);
  backdrop-filter: saturate(1.6) blur(14px);
  padding-top: env(safe-area-inset-top, 0px);
}
.appbar .wrap { display: flex; align-items: center; gap: 8px; height: 54px; }
.brand { display: flex; align-items: center; gap: 9px; font-weight: 800; font-size: 18px; letter-spacing: -.02em; }
.brand-mark { width: 30px; height: 30px; border-radius: 9px; background: var(--accent); color: var(--accent-ink); display: grid; place-items: center; }
.brand-mark .ic { width: 18px; height: 18px; stroke-width: 2.4; }
.spacer { flex: 1; }
.clock-pill { display: inline-flex; align-items: center; gap: 6px; height: 32px; padding: 0 12px; border-radius: 999px; background: var(--accent-soft); color: var(--accent-strong); font-weight: 750; font-size: 14px; }
.clock-pill .ic { width: 16px; height: 16px; }
.icon-btn { width: 40px; height: 40px; border-radius: 12px; display: inline-grid; place-items: center; color: var(--text-2); flex: none; }
.icon-btn:active { background: var(--surface-3); }

/* Page head */
main { padding-bottom: calc(132px + var(--safe-b)); }
.page-head { padding: 6px 0 14px; }
.date-btn { position: relative; display: inline-flex; align-items: center; gap: 6px; color: var(--text-2); font-size: 14px; font-weight: 650; padding: 5px 10px 5px 8px; margin-left: -8px; border-radius: 999px; }
.date-btn .ic { width: 16px; height: 16px; }
.date-btn:active { background: var(--surface-3); }
.date-btn input { position: absolute; inset: 0; width: 100%; height: 100%; opacity: 0; cursor: pointer; border: 0; padding: 0; }
h1 { font-size: 30px; line-height: 1.15; letter-spacing: -.02em; margin: 2px 0 0; font-weight: 800; }

/* Stats */
.stats { background: var(--surface); border-radius: var(--r-lg); box-shadow: var(--shadow); padding: 14px 16px; margin-bottom: 16px; }
.stats-row { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; }
.stat b { display: block; font-size: 22px; font-weight: 800; letter-spacing: -.01em; line-height: 1.2; }
.stat span { font-size: 12px; color: var(--text-3); font-weight: 650; }
.progress { height: 6px; border-radius: 99px; background: var(--surface-3); margin-top: 12px; overflow: hidden; }
.progress i { display: block; height: 100%; width: 0; background: var(--accent); border-radius: inherit; transition: width .3s ease; }

/* Empty state */
.empty { background: var(--surface); border-radius: var(--r-lg); box-shadow: var(--shadow); padding: 30px 20px 20px; text-align: center; }
.empty-icon { width: 64px; height: 64px; border-radius: 20px; background: var(--accent-soft); color: var(--accent-strong); display: grid; place-items: center; margin: 0 auto 14px; }
.empty-icon .ic { width: 32px; height: 32px; }
.empty h2 { margin: 0 0 6px; font-size: 20px; }
.empty p { margin: 0 auto 18px; color: var(--text-2); max-width: 300px; font-size: 14px; }
.empty .btn { width: 100%; margin-top: 8px; }

/* Buttons */
.btn { display: inline-flex; align-items: center; justify-content: center; gap: 8px; height: 48px; padding: 0 18px; border-radius: 14px; font-weight: 750; font-size: 16px; background: var(--surface); color: var(--text); box-shadow: inset 0 0 0 1px var(--line); white-space: nowrap; }
.btn .ic { width: 19px; height: 19px; }
.btn.primary { background: var(--accent); color: var(--accent-ink); box-shadow: none; }
.btn.soft { background: var(--surface-2); box-shadow: none; }
.btn.danger { color: var(--danger); }
.btn.block { width: 100%; }
.btn.lg { height: 56px; font-size: 17px; border-radius: 16px; }
.btn.sm { height: 36px; padding: 0 14px; font-size: 14px; border-radius: 11px; }
.btn.grow { flex: 1; }
.btn:active, .pill:active, .check:active, .next-btn:active { transform: scale(.97); }

/* Exercise cards */
.ex-list { display: flex; flex-direction: column; gap: 14px; }
.ex-card { background: var(--surface); border-radius: var(--r-lg); box-shadow: var(--shadow); padding: 12px 10px 6px; }
.ex-head { display: flex; align-items: flex-start; gap: 10px; padding: 2px 2px 8px 6px; }
.ex-num { width: 28px; height: 28px; border-radius: 9px; background: var(--surface-2); display: grid; place-items: center; font-weight: 800; font-size: 13px; color: var(--text-2); flex: none; margin-top: 1px; }
.ex-num .ic { width: 16px; height: 16px; stroke-width: 3; }
.ex-card.complete .ex-num { background: var(--done); color: var(--done-ink); }
.ex-title { flex: 1; min-width: 0; text-align: left; display: block; }
.ex-name { display: block; font-size: 17px; font-weight: 750; line-height: 1.3; word-break: break-word; }
.ex-meta { display: flex; flex-wrap: wrap; gap: 4px 10px; margin-top: 3px; font-size: 12.5px; color: var(--text-3); align-items: center; }
.ex-meta .ic { width: 13px; height: 13px; vertical-align: -2px; margin-right: 2px; }
.tag { display: inline-block; font-size: 11.5px; font-weight: 700; padding: 1px 7px; border-radius: 6px; background: var(--surface-2); color: var(--text-2); white-space: nowrap; }

.set-head, .set-row { display: grid; grid-template-columns: 34px minmax(0, 1fr) 78px 64px 44px; gap: 6px; align-items: center; }
.set-head { font-size: 11.5px; font-weight: 750; color: var(--text-3); padding: 0 4px 4px; }
.set-head span { text-align: center; }
.set-row { padding: 4px; border-radius: 12px; transition: background .2s; }
.set-row + .set-row { margin-top: 2px; }
.set-row.done { background: var(--done-soft); }
.set-row.next .set-no { color: var(--accent-strong); background: var(--accent-soft); }
.set-no { height: 36px; border-radius: 9px; font-weight: 800; color: var(--text-2); font-size: 14px; }
.set-no:active { background: var(--surface-3); }
.set-prev { height: 36px; font-size: 13px; color: var(--text-3); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; border-radius: 9px; padding: 0 4px; font-variant-numeric: tabular-nums; }
.set-prev:not(:disabled):active { background: var(--surface-3); }
.set-prev:disabled { opacity: 1; }
.set-in { width: 100%; height: 40px; border: 0; border-radius: 10px; background: var(--surface-2); text-align: center; font-size: 17px; font-weight: 750; font-variant-numeric: tabular-nums; outline: none; padding: 0 4px; -webkit-appearance: none; appearance: none; }
.set-in:focus { box-shadow: inset 0 0 0 2px var(--accent); background: var(--surface); }
.set-in::placeholder { color: var(--text-3); font-weight: 600; opacity: .8; }
.set-row.done .set-in { background: transparent; }
.check { width: 42px; height: 40px; border-radius: 12px; background: var(--surface-2); display: grid; place-items: center; color: var(--text-3); justify-self: end; transition: background .15s, color .15s; }
.check .ic { stroke-width: 3; }
.set-row.done .check { background: var(--done); color: var(--done-ink); }
.set-row.next .check { box-shadow: inset 0 0 0 2px var(--accent); color: var(--accent-strong); }
.add-set { width: 100%; height: 42px; margin-top: 2px; border-radius: 12px; color: var(--accent-strong); font-weight: 750; font-size: 15px; display: flex; align-items: center; justify-content: center; gap: 6px; }
.add-set .ic { width: 18px; height: 18px; }
.add-set:active { background: var(--accent-soft); }
.no-sets { text-align: center; color: var(--text-3); font-size: 13px; padding: 8px 0 2px; }
@media (max-width: 352px) {
  .set-head, .set-row { grid-template-columns: 30px 0 minmax(0, 1fr) 60px 42px; gap: 5px; }
  .set-prev, .set-head span:nth-child(2) { visibility: hidden; }
}

.add-ex { width: 100%; margin-top: 14px; height: 56px; border-radius: var(--r-lg); border: 1.5px dashed var(--surface-3); color: var(--accent-strong); font-weight: 750; font-size: 16px; display: flex; align-items: center; justify-content: center; gap: 8px; }
.add-ex:active { background: var(--accent-soft); }

/* Dock */
.dock { position: fixed; left: 0; right: 0; bottom: 0; z-index: 30; padding: 18px 16px calc(12px + var(--safe-b)); background: linear-gradient(to top, var(--bg) 62%, transparent); pointer-events: none; }
.dock-inner { max-width: 608px; margin: 0 auto; pointer-events: auto; }
body.typing .dock { display: none; }
.dock-row { display: flex; gap: 10px; }
.next-btn { width: 100%; height: 64px; border-radius: 18px; background: var(--accent); color: var(--accent-ink); display: flex; align-items: center; gap: 12px; padding: 0 14px 0 12px; text-align: left; }
.next-ic { width: 40px; height: 40px; border-radius: 12px; background: rgba(255,255,255,.18); display: grid; place-items: center; flex: none; }
.next-main { flex: 1; min-width: 0; display: flex; flex-direction: column; }
.next-main small { font-size: 12px; font-weight: 700; opacity: .85; }
.next-main b { font-size: 16px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.next-val { font-weight: 800; font-size: 15px; white-space: nowrap; }

.rest-bar { position: relative; overflow: hidden; display: flex; align-items: center; gap: 6px; padding: 8px; border-radius: 18px; background: var(--surface); box-shadow: var(--shadow-lg), inset 0 0 0 1px var(--line); }
.rest-fill { position: absolute; inset: 0; background: var(--accent-soft); transform-origin: left center; transition: transform .25s linear; }
.rest-main { position: relative; flex: 1; min-width: 0; display: flex; flex-direction: column; align-items: flex-start; padding: 2px 8px; text-align: left; }
.rest-label { font-size: 12px; font-weight: 750; color: var(--accent-strong); }
.rest-time { font-size: 26px; font-weight: 800; line-height: 1.1; letter-spacing: -.01em; }
.rest-next { font-size: 12.5px; color: var(--text-2); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; max-width: 100%; }
.pill { position: relative; height: 42px; min-width: 50px; padding: 0 10px; border-radius: 12px; background: var(--surface-2); font-weight: 750; font-size: 14px; white-space: nowrap; }
.pill.accent { background: var(--accent); color: var(--accent-ink); }
.rest-bar.over .rest-fill { background: var(--warn-soft); }
.rest-bar.over .rest-label { color: var(--warn); }

/* Toast */
.toast { position: fixed; left: 50%; bottom: calc(100px + var(--safe-b)); z-index: 70; transform: translate(-50%, 16px); opacity: 0; pointer-events: none; background: var(--toast-bg); color: var(--toast-fg); border-radius: 14px; padding: 10px 10px 10px 16px; display: flex; gap: 10px; align-items: center; font-size: 14px; font-weight: 650; box-shadow: 0 8px 30px rgba(0,0,0,.25); transition: opacity .2s, transform .2s; width: max-content; max-width: calc(100vw - 32px); min-height: 44px; }
.toast.show { opacity: 1; transform: translate(-50%, 0); pointer-events: auto; }
.toast button { color: var(--toast-act); font-weight: 800; padding: 6px 8px; border-radius: 8px; }

/* Sheets */
.layer { position: fixed; inset: 0; z-index: 50; display: none; }
.layer.open { display: block; }
.backdrop { position: absolute; inset: 0; background: rgba(8, 12, 16, .45); animation: fade .2s ease; }
.sheet { position: absolute; left: 0; right: 0; bottom: 0; margin: 0 auto; max-width: 640px; max-height: 90vh; max-height: 90dvh; display: flex; flex-direction: column; background: var(--surface); border-radius: 22px 22px 0 0; box-shadow: var(--shadow-lg); animation: up .28s cubic-bezier(.2, .8, .2, 1); padding-bottom: var(--safe-b); }
.layer.static .sheet, .layer.static .backdrop { animation: none; }
.sheet.tall { height: 90vh; height: 90dvh; }
.grabber { width: 38px; height: 5px; border-radius: 9px; background: var(--surface-3); margin: 8px auto 0; flex: none; }
.sheet-head { display: flex; align-items: center; gap: 8px; padding: 10px 12px 10px 18px; flex: none; }
.sheet-head h3 { flex: 1; font-size: 19px; margin: 0; font-weight: 800; min-width: 0; }
.sheet-head p { margin: 2px 0 0; font-size: 13px; color: var(--text-3); }
.sheet-body { flex: 1; overflow-y: auto; padding: 0 18px 14px; overscroll-behavior: contain; }
.sheet-foot { flex: none; padding: 12px 16px 14px; border-top: 1px solid var(--line); display: flex; gap: 10px; flex-wrap: wrap; }
@keyframes up { from { transform: translateY(100%); } to { transform: none; } }
@keyframes fade { from { opacity: 0; } }
@media (min-width: 720px) {
  .sheet { bottom: auto; top: 50%; transform: translateY(-50%); border-radius: 22px; max-height: 82vh; animation: pop .22s ease; padding-bottom: 0; }
  .sheet.tall { height: 82vh; }
  .grabber { display: none; }
  @keyframes pop { from { opacity: 0; transform: translateY(-47%); } to { opacity: 1; transform: translateY(-50%); } }
}

.menu { display: flex; flex-direction: column; }
.menu-item { display: flex; align-items: center; gap: 14px; padding: 13px 4px; border-bottom: 1px solid var(--line); font-size: 16px; font-weight: 650; text-align: left; width: 100%; }
.menu-item:last-child { border-bottom: 0; }
.menu-item .ic { color: var(--text-2); }
.menu-item small { display: block; font-size: 12.5px; color: var(--text-3); font-weight: 500; }
.menu-item.danger, .menu-item.danger .ic { color: var(--danger); }
.menu-item:active { background: var(--surface-2); }
.section-label { font-size: 12px; font-weight: 800; color: var(--text-3); letter-spacing: .06em; margin: 16px 0 8px; }
.section-label:first-child { margin-top: 2px; }
.chips { display: flex; flex-wrap: wrap; gap: 8px; }
.chip { height: 36px; padding: 0 14px; border-radius: 999px; background: var(--surface-2); font-weight: 700; font-size: 14px; color: var(--text-2); white-space: nowrap; }
.chip.on { background: var(--accent); color: var(--accent-ink); }
.hint { font-size: 13px; color: var(--text-3); margin: 12px 0 0; }
.field { width: 100%; border: 0; border-radius: 12px; background: var(--surface-2); padding: 12px 14px; font-size: 16px; outline: none; -webkit-appearance: none; appearance: none; }
.field:focus { box-shadow: inset 0 0 0 2px var(--accent); }
textarea.field { min-height: 170px; resize: vertical; font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; font-size: 13px; line-height: 1.5; }
.toggle-row { display: flex; align-items: center; justify-content: space-between; gap: 12px; padding: 12px 0; border-bottom: 1px solid var(--line); font-weight: 650; }
.toggle-row small { display: block; font-size: 12.5px; color: var(--text-3); font-weight: 500; }
.switch { -webkit-appearance: none; appearance: none; width: 50px; height: 30px; border-radius: 99px; background: var(--surface-3); position: relative; cursor: pointer; transition: background .2s; flex: none; margin: 0; }
.switch::after { content: ""; position: absolute; top: 3px; left: 3px; width: 24px; height: 24px; border-radius: 50%; background: #fff; box-shadow: 0 1px 3px rgba(0,0,0,.25); transition: transform .2s; }
.switch:checked { background: var(--accent); }
.switch:checked::after { transform: translateX(20px); }

/* Picker */
.search { margin: 0 16px 10px; display: flex; align-items: center; gap: 8px; height: 46px; padding: 0 12px; border-radius: 13px; background: var(--surface-2); color: var(--text-3); flex: none; }
.search input { flex: 1; border: 0; background: transparent; outline: none; font-size: 16px; color: var(--text); min-width: 0; -webkit-appearance: none; appearance: none; }
.search input::-webkit-search-cancel-button { display: none; }
.cat-row { display: flex; gap: 8px; overflow-x: auto; padding: 0 16px 10px; scrollbar-width: none; flex: none; }
.cat-row::-webkit-scrollbar { display: none; }
.cat-row .chip { flex: none; }
.pick-group { font-size: 12px; font-weight: 800; color: var(--text-3); margin: 14px 4px 2px; letter-spacing: .06em; }
.pick-group:first-child { margin-top: 2px; }
.pick-row { display: flex; align-items: center; gap: 12px; width: 100%; padding: 10px 6px; border-radius: 12px; text-align: left; }
.pick-row:active { background: var(--surface-2); }
.pick-check { width: 26px; height: 26px; border-radius: 50%; box-shadow: inset 0 0 0 2px var(--surface-3); display: grid; place-items: center; flex: none; color: transparent; transition: background .15s; }
.pick-check .ic { width: 16px; height: 16px; stroke-width: 3; }
.pick-row.sel .pick-check { background: var(--accent); box-shadow: none; color: var(--accent-ink); }
.pick-row.add .pick-check { background: var(--accent-soft); box-shadow: none; color: var(--accent-strong); }
.pick-main { flex: 1; min-width: 0; display: flex; flex-direction: column; }
.pick-name { font-weight: 700; font-size: 16px; }
.pick-sub { font-size: 12.5px; color: var(--text-3); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.pick-empty { text-align: center; color: var(--text-3); padding: 30px 10px; font-size: 14px; }

/* History & summary */
.hist { width: 100%; text-align: left; padding: 14px 2px; border-bottom: 1px solid var(--line); display: grid; grid-template-columns: 1fr auto; gap: 3px 12px; align-items: center; }
.hist:active { background: var(--surface-2); }
.hist > .ic { grid-column: 2; grid-row: 1 / span 3; color: var(--text-3); }
.hist:last-child { border-bottom: 0; }
.hist b { font-size: 15px; }
.hist-names { font-size: 13.5px; color: var(--text-2); grid-column: 1; }
.hist-meta { font-size: 12.5px; color: var(--text-3); grid-column: 1; }
.sum-grid { display: grid; grid-template-columns: repeat(2, 1fr); gap: 10px; margin-bottom: 8px; }
.sum-card { background: var(--surface-2); border-radius: 14px; padding: 12px 14px; }
.sum-card b { font-size: 22px; display: block; font-weight: 800; }
.sum-card span { font-size: 12px; color: var(--text-3); font-weight: 700; }
.sum-ex { padding: 12px 0; border-bottom: 1px solid var(--line); }
.sum-ex:last-child { border-bottom: 0; }
.sum-ex b { font-size: 15px; }
.sum-sets { display: flex; flex-wrap: wrap; gap: 6px; margin-top: 6px; }
.sum-sets span { font-size: 13px; padding: 3px 8px; border-radius: 8px; background: var(--surface-2); font-weight: 650; font-variant-numeric: tabular-nums; }
.sheet-foot .btn { flex: 1 1 40%; }

/* Export / import */
.fmt-list { display: flex; flex-direction: column; gap: 8px; }
.fmt { display: flex; align-items: center; gap: 12px; width: 100%; padding: 10px 12px; border-radius: 14px; background: var(--surface-2); text-align: left; box-shadow: inset 0 0 0 2px transparent; transition: box-shadow .15s, background .15s; }
.fmt.on { background: var(--accent-soft); box-shadow: inset 0 0 0 2px var(--accent); }
.fmt-main { flex: 1; min-width: 0; display: flex; flex-direction: column; }

<script>
'use strict';

/* ---------- Utilities ---------- */
const $ = (sel, root = document) => root.querySelector(sel);
const $$ = (sel, root = document) => [...root.querySelectorAll(sel)];
const uid = () => Math.random().toString(36).slice(2, 10);
const pad = n => String(n).padStart(2, '0');
const norm = s => String(s ?? '').trim().toLowerCase();
const num = v => { const n = parseFloat(v); return Number.isFinite(n) ? n : 0; };
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));

function todayISO() {
  const d = new Date();
  return `${d.getFullYear()}-${pad(d.getMonth() + 1)}-${pad(d.getDate())}`;
}
function parseDay(iso) { const d = new Date(`${iso}T00:00:00`); return isNaN(d) ? null : d; }
function fmtDate(iso) {
  const d = parseDay(iso); if (!d) return iso || '';
  return `${d.getMonth() + 1}月${d.getDate()}日 週${'日一二三四五六'[d.getDay()]}`;
}
function relDay(iso) {
  const d = parseDay(iso), t = parseDay(todayISO());
  if (!d) return iso || '';
  const diff = Math.round((t - d) / 86400000);
  if (diff === 0) return '今天';
  if (diff === 1) return '昨天';
  if (diff > 1 && diff < 7) return `${diff} 天前`;
  return `${d.getMonth() + 1}/${d.getDate()}`;
}
function fmtClock(sec) {
  sec = Math.max(0, Math.floor(sec));
  const h = Math.floor(sec / 3600), m = Math.floor(sec % 3600 / 60), s = sec % 60;
  return h ? `${h}:${pad(m)}:${pad(s)}` : `${pad(m)}:${pad(s)}`;
}
function fmtRest(sec) { sec = Math.max(0, Math.round(sec)); return `${Math.floor(sec / 60)}:${pad(sec % 60)}`; }
function fmtDur(sec) {
  const m = Math.round(sec / 60);
  if (m < 60) return `${m} 分`;
  return `${Math.floor(m / 60)} 小時 ${m % 60} 分`;
}
function fmtVol(v) { return Math.round(v).toLocaleString('en-US'); }
function fmtW(n) { return String(Math.round(n * 100) / 100); }
function localStamp(ms) {
  const d = new Date(ms);
  return `${d.getFullYear()}-${pad(d.getMonth() + 1)}-${pad(d.getDate())} ${pad(d.getHours())}:${pad(d.getMinutes())}:${pad(d.getSeconds())}`;
}

/* ---------- Icons ---------- */
const ICONS = {
  more: '<circle cx="5" cy="12" r="1.7" fill="currentColor" stroke="none"/><circle cx="12" cy="12" r="1.7" fill="currentColor" stroke="none"/><circle cx="19" cy="12" r="1.7" fill="currentColor" stroke="none"/>',
  check: '<path d="M5 12.5l4.5 4.5L19 7.5"/>',
  plus: '<path d="M12 5v14M5 12h14"/>',
  minus: '<path d="M5 12h14"/>',
  x: '<path d="M6 6l12 12M18 6L6 18"/>',
  down: '<path d="M6 9l6 6 6-6"/>',
  left: '<path d="M15 6l-6 6 6 6"/>',
  right: '<path d="M9 6l6 6-6 6"/>',
  cal: '<rect x="3.5" y="5" width="17" height="15.5" rx="2.5"/><path d="M3.5 10h17M8 3v4M16 3v4"/>',
  clock: '<circle cx="12" cy="12" r="8.5"/><path d="M12 7.5V12l3 2"/>',
  timer: '<circle cx="12" cy="13.5" r="7.5"/><path d="M12 10v3.5l2.5 1.5M9.5 2.5h5"/>',
  search: '<circle cx="11" cy="11" r="6.5"/><path d="M20 20l-4.2-4.2"/>',
  trash: '<path d="M4 7h16M10 11v6M14 11v6M6 7l1 12.5A1.5 1.5 0 0 0 8.5 21h7a1.5 1.5 0 0 0 1.5-1.5L18 7M9 7V4h6v3"/>',
  copy: '<rect x="8" y="8" width="12" height="12" rx="2"/><path d="M16 8V5.5A1.5 1.5 0 0 0 14.5 4h-9A1.5 1.5 0 0 0 4 5.5v9A1.5 1.5 0 0 0 5.5 16H8"/>',
  share: '<path d="M12 3v12M7.5 7.5L12 3l4.5 4.5M5 13v5.5A1.5 1.5 0 0 0 6.5 20h11a1.5 1.5 0 0 0 1.5-1.5V13"/>',
  download: '<path d="M12 4v11M7.5 10.5L12 15l4.5-4.5M5 19.5h14"/>',
  upload: '<path d="M12 15V4M7.5 8.5L12 4l4.5 4.5M5 19.5h14"/>',
  sliders: '<path d="M4 7h9M17 7h3M4 17h3M11 17h9"/><circle cx="15" cy="7" r="2"/><circle cx="9" cy="17" r="2"/>',
  history: '<path d="M4 12a8 8 0 1 0 2.4-5.7M4 4.5V8h3.5M12 8v4.5l3 1.5"/>',
  flag: '<path d="M5 21V4M5 4h12l-2.5 4.5L17 13H5"/>',
  play: '<path d="M8 5.5v13l10.5-6.5z" fill="currentColor"/>',
  up: '<path d="M12 19V5M6 11l6-6 6 6"/>',
  arrowDown: '<path d="M12 5v14M6 13l6 6 6-6"/>',
  edit: '<path d="M4 20h4L19 9l-4-4L4 16v4zM13.5 6.5l4 4"/>',
  dumbbell: '<path d="M6.5 6.5v11M17.5 6.5v11M3.5 9v6M20.5 9v6M6.5 12h11"/>',
  repeat: '<path d="M4 11V9a3 3 0 0 1 3-3h12M16 3l3 3-3 3M20 13v2a3 3 0 0 1-3 3H5M8 21l-3-3 3-3"/>',
  list: '<path d="M9 6h11M9 12h11M9 18h11M4.5 6h.01M4.5 12h.01M4.5 18h.01"/>',
  refresh: '<path d="M20 11a8 8 0 1 0-2.3 5.7M20 4v7h-7"/>',
};
const ic = (name, cls = '') => `<svg class="ic ${cls}" viewBox="0 0 24 24" aria-hidden="true">${ICONS[name] || ''}</svg>`;

/* ---------- Exercise library: 30 common presets ---------- */
// sets × reps is the suggested start for an exercise with no history; rest is in seconds.
// unit 'sec' = timed hold (the reps column becomes seconds); bw = bodyweight (weight optional).
const PRESETS = [
  { name: '槓鈴臥推', cat: '胸', sets: 3, reps: 8, rest: 150 },
  { name: '啞鈴臥推', cat: '胸', sets: 3, reps: 10, rest: 120 },
  { name: '上斜啞鈴臥推', cat: '胸', sets: 3, reps: 10, rest: 120 },
  { name: '繩索夾胸', cat: '胸', sets: 3, reps: 12, rest: 60 },
  { name: '伏地挺身', cat: '胸', sets: 3, reps: 15, rest: 60, bw: true },
  { name: '引體向上', cat: '背', sets: 3, reps: 8, rest: 120, bw: true },
  { name: '滑輪下拉', cat: '背', sets: 3, reps: 10, rest: 90 },
  { name: '槓鈴划船', cat: '背', sets: 3, reps: 8, rest: 120 },
  { name: '啞鈴單臂划船', cat: '背', sets: 3, reps: 10, rest: 90 },
  { name: '坐姿划船', cat: '背', sets: 3, reps: 10, rest: 90 },
  { name: '傳統硬舉', cat: '背', sets: 3, reps: 5, rest: 180 },
  { name: '槓鈴深蹲', cat: '腿', sets: 3, reps: 5, rest: 180 },
  { name: '腿推舉', cat: '腿', sets: 3, reps: 10, rest: 120 },
  { name: '羅馬尼亞硬舉', cat: '腿', sets: 3, reps: 8, rest: 120 },
  { name: '保加利亞分腿蹲', cat: '腿', sets: 3, reps: 10, rest: 90 },
  { name: '腿伸屈', cat: '腿', sets: 3, reps: 12, rest: 60 },
  { name: '腿後勾', cat: '腿', sets: 3, reps: 12, rest: 60 },
  { name: '臀推', cat: '腿', sets: 3, reps: 10, rest: 90 },
  { name: '槓鈴肩推', cat: '肩', sets: 3, reps: 6, rest: 150 },
  { name: '啞鈴肩推', cat: '肩', sets: 3, reps: 10, rest: 90 },
  { name: '側平舉', cat: '肩', sets: 3, reps: 15, rest: 60 },
  { name: '臉拉', cat: '肩', sets: 3, reps: 15, rest: 60 },
  { name: '槓鈴彎舉', cat: '手臂', sets: 3, reps: 10, rest: 60 },
  { name: '錘式彎舉', cat: '手臂', sets: 3, reps: 12, rest: 60 },
  { name: '繩索三頭下壓', cat: '手臂', sets: 3, reps: 12, rest: 60 },
  { name: '過頭三頭伸展', cat: '手臂', sets: 3, reps: 12, rest: 60 },
  { name: '棒式', cat: '核心', sets: 3, reps: 60, rest: 60, unit: 'sec', bw: true },
  { name: '懸垂舉腿', cat: '核心', sets: 3, reps: 12, rest: 60, bw: true },
  { name: '捲腹', cat: '核心', sets: 3, reps: 20, rest: 45, bw: true },
  { name: '健腹輪', cat: '核心', sets: 3, reps: 10, rest: 60, bw: true },
];
const CATS = ['胸', '背', '腿', '肩', '手臂', '核心'];
const LIBRARY = {};
CATS.forEach(c => { LIBRARY[c] = PRESETS.filter(p => p.cat === c).map(p => p.name); });
const PRESET = new Map(PRESETS.map(p => [norm(p.name), p]));
const BUILTIN = new Map(PRESETS.map(p => [norm(p.name), p.cat]));
const REST_OPTIONS = [0, 30, 45, 60, 90, 120, 150, 180, 240, 300];
const STEP_OPTIONS = [1, 2, 2.5, 5];

/* ---------- State & storage ---------- */
const KEY = 'fugym.app.v3';
const OLD_RECORDER_KEY = 'gymlogger.fulab.v2';
const OLD_TRAINER_KEY = 'fugym.trainer.v1';

function freshWorkout() { return { id: uid(), date: todayISO(), startedAt: null, finishedAt: null, lastExId: null, exercises: [] }; }
function freshState() {
  return {
    v: 3,
    workout: freshWorkout(),
    sessions: [],
    custom: [],
    restPrefs: {},
    units: {},
    settings: { rest: 90, step: 2.5, sound: true, vibrate: true, wake: true, obsLinks: true, exportFormat: 'obsidian' },
    timer: null,
  };
}
function mkSet(w = '', r = '') { return { id: uid(), w: String(w ?? ''), r: String(r ?? ''), done: false, doneAt: null, gap: null }; }

function normalize(d) {
  const s = freshState();
  if (d && typeof d === 'object') {
    if (d.workout && Array.isArray(d.workout.exercises)) s.workout = Object.assign(freshWorkout(), d.workout);
    if (Array.isArray(d.sessions)) s.sessions = d.sessions.filter(x => x && Array.isArray(x.exercises));
    if (Array.isArray(d.custom)) s.custom = d.custom.filter(x => x && x.name);
    if (d.restPrefs && typeof d.restPrefs === 'object') s.restPrefs = d.restPrefs;
    if (d.units && typeof d.units === 'object') s.units = d.units;
    Object.assign(s.settings, d.settings || {});
    s.timer = d.timer || null;
  }
  for (const ex of s.workout.exercises) {
    ex.id = ex.id || uid();
    ex.name = String(ex.name || '').trim() || '未命名項目';
    if (ex.rest === undefined) ex.rest = null;
    if (!Array.isArray(ex.sets)) ex.sets = [];
    for (const st of ex.sets) {
      st.id = st.id || uid();
      st.w = String(st.w ?? ''); st.r = String(st.r ?? '');
      st.done = !!st.done;
      if (!st.done) { st.doneAt = null; st.gap = null; }
    }
  }
  return s;
}

// Bring over data from the previous Plan / Train versions.
function migrateOld() {
  const s = freshState();
  try {
    const old = JSON.parse(localStorage.getItem(OLD_RECORDER_KEY) || 'null');
    if (old && Array.isArray(old.exercises)) {
      for (const ex of old.exercises) {
        const name = String(ex.name || '').trim() || '未命名項目';
        const sets = [];
        for (const row of (ex.sets || [])) {
          const n = Math.max(1, Math.min(20, parseInt(row.s, 10) || 1));
          for (let i = 0; i < n; i++) sets.push(mkSet(row.w, row.r));
        }
        if (!sets.length) sets.push(mkSet());
        s.workout.exercises.push({ id: uid(), name, rest: null, sets });
        if (!BUILTIN.has(norm(name))) s.custom.push({ name, cat: '自訂' });
      }
    }
  } catch (e) {}
  try {
    const t = JSON.parse(localStorage.getItem(OLD_TRAINER_KEY) || 'null');
    if (t && Array.isArray(t.log) && t.log.length) {
      const exercises = [];
      for (const row of t.log) {
        const name = String(row.exercise || '').trim() || '未命名項目';
        let ex = exercises[exercises.length - 1];
        if (!ex || ex.name !== name) { ex = { name, rest: null, sets: [] }; exercises.push(ex); }
        const at = Date.parse(row.date) || null;
        ex.sets.push({ w: String(row.weight || ''), r: String(row.actualReps || ''), doneAt: at, gap: row.restSeconds === '' ? null : row.restSeconds });
      }
      const first = Date.parse(t.log[0].date), last = Date.parse(t.log[t.log.length - 1].date);
      const day = isNaN(first) ? todayISO() : localStamp(first).slice(0, 10);
      s.sessions.push({ id: uid(), date: day, startedAt: first || null, finishedAt: last || null, exercises });
    }
  } catch (e) {}
  return s;
}

function load() {
  try {
    const raw = localStorage.getItem(KEY);
    if (raw) return normalize(JSON.parse(raw));
  } catch (e) {}
  return migrateOld();
}

let S = load();
let perfCache = new Map();

function save() {
  archive();
  perfCache = new Map();
  try { localStorage.setItem(KEY, JSON.stringify(S)); } catch (e) {}
}

// Keep a history entry of the current workout (only completed sets) so that
// "上次" values and the history list are always up to date.
function archive() {
  const w = S.workout;
  const exercises = w.exercises
    .map(ex => ({ name: ex.name, rest: ex.rest, sets: ex.sets.filter(s => s.done).map(s => ({ w: s.w, r: s.r, doneAt: s.doneAt, gap: s.gap })) }))
    .filter(ex => ex.sets.length);
  const i = S.sessions.findIndex(x => x.id === w.id);
  if (!exercises.length) { if (i >= 0) S.sessions.splice(i, 1); return; }
  const rec = { id: w.id, date: w.date, startedAt: w.startedAt, finishedAt: w.finishedAt, exercises };
  if (i >= 0) S.sessions[i] = rec; else S.sessions.push(rec);
  sortSessions();
}
function sortSessions() {
  S.sessions.sort((a, b) => a.date < b.date ? -1 : a.date > b.date ? 1 : (a.startedAt || 0) - (b.startedAt || 0));
  if (S.sessions.length > 2000) S.sessions.splice(0, S.sessions.length - 2000);
}

/* ---------- Derived data ---------- */
const findEx = id => S.workout.exercises.find(e => e.id === id);
const restOf = ex => (ex && ex.rest != null) ? ex.rest : S.settings.rest;
const presetOf = name => PRESET.get(norm(name)) || null;

// Rest for a newly added exercise: your own setting > last time > preset suggestion > global default.
function defaultRest(name, lastRest) {

function lastPerf(name) {
  const key = norm(name);
  if (perfCache.has(key)) return perfCache.get(key);
  let found = null;
  for (let i = S.sessions.length - 1; i >= 0 && !found; i--) {
    const s = S.sessions[i];
    if (s.id === S.workout.id) continue;
    const ex = s.exercises.find(e => norm(e.name) === key);

}
function lastSession() {
  for (let i = S.sessions.length - 1; i >= 0; i--) if (S.sessions[i].id !== S.workout.id) return S.sessions[i];
  return null;
}
function catOf(name) {

}
function customNames() {
  const out = new Map();
  for (const c of S.custom) if (!BUILTIN.has(norm(c.name))) out.set(norm(c.name), c.name);
  for (const s of S.sessions) for (const e of s.exercises) if (!BUILTIN.has(norm(e.name)) && !out.has(norm(e.name))) out.set(norm(e.name), e.name);
  return [...out.values()];
}
function allNames() {
  const out = new Map();

  for (const n of customNames()) if (!out.has(norm(n))) out.set(norm(n), n);

}
function recentNames() {
  const out = new Map();

    const s = S.sessions[i];

}
function stats(w = S.workout) {
  let total = 0, done = 0, vol = 0;

    if (s.done) { done++; vol += num(s.w) * num(s.r); }

}
function sessionStats(s) {

// The next set to do: keep going on the exercise you're on, then move down the list (wrapping around).
function nextTarget() {

  for (let k = 0; k < list.length; k++) {
    const ex = list[(start + k) % list.length];
    const set = ex.sets.find(s => !s.done);
    if (set) return { ex, set };

}
function lastDoneAt() {
  let t = 0;

  return t;
}
// Suggested values for an empty set: the set above it today, otherwise the same set last time.
function placeholderFor(ex, set) {

  let w = '', r = '';
  for (let i = idx - 1; i >= 0 && !(w && r); i--) {
    if (!w && ex.sets[i].w) w = ex.sets[i].w;
    if (!r && ex.sets[i].r) r = ex.sets[i].r;
  }
  const last = lastPerf(ex.name);
  if (last && last.sets.length) {
    const ls = last.sets[Math.min(idx, last.sets.length - 1)];

}
function prevSetOf(ex, idx) {

}
function setText(w, r, unit = 'reps') {

}
function setLabel(ex, set) {

/* ---------- Feedback: sound, vibration, wake lock ---------- */
let actx = null;
function unlockAudio() {
  try {
    if (!actx) actx = new (window.AudioContext || window.webkitAudioContext)();

  } catch (e) {}
}
document.addEventListener('pointerdown', unlockAudio, { passive: true });
function tone(freq, dur, when = 0, vol = 0.22) {
  if (!S.settings.sound || !actx) return;
  try {
    const t = actx.currentTime + when;
    const o = actx.createOscillator(), g = actx.createGain();
    o.type = 'sine'; o.frequency.value = freq;
    g.gain.setValueAtTime(0.0001, t);
    g.gain.exponentialRampToValueAtTime(vol, t + 0.015);
    g.gain.exponentialRampToValueAtTime(0.0001, t + dur);
    o.connect(g).connect(actx.destination);
    o.start(t); o.stop(t + dur + 0.03);
  } catch (e) {}
}

}
let wakeLock = null;
async function syncWakeLock() {
  const want = S.settings.wake && S.workout.startedAt && !S.workout.finishedAt && document.visibilityState === 'visible';
  try {
    if (want && !wakeLock && 'wakeLock' in navigator) {
      wakeLock = await navigator.wakeLock.request('screen');
      wakeLock.addEventListener('release', () => { wakeLock = null; });
    } else if (!want && wakeLock) {

}

let toastTimer = null;

/* ---------- Workout actions ---------- */
function addExercises(names) {
  const added = [];
  for (const name of names) {
    const last = lastPerf(name);
    const p = presetOf(name);
    let sets;
    if (last && last.sets.length) sets = last.sets.map(s => mkSet(s.w, s.r));
    else if (p) sets = Array.from({ length: p.sets }, () => mkSet('', p.reps));
    else sets = [mkSet(), mkSet(), mkSet()];
    const ex = { id: uid(), name, rest: defaultRest(name, last ? last.rest : null), sets };
    S.workout.exercises.push(ex);
    added.push(ex);
  }
  if (S.workout.finishedAt && added.length) S.workout.finishedAt = null;
  save(); renderAll();
  return added;
}
// Copy a session's exercises (with its weights and reps) into today's list.
function planFrom(s) {
  const have = new Set(S.workout.exercises.map(e => norm(e.name)));
  let n = 0;
  for (const e of s.exercises) {
    if (have.has(norm(e.name)) || !e.sets.length) continue;
    have.add(norm(e.name));
    S.workout.exercises.push({ id: uid(), name: e.name, rest: defaultRest(e.name, e.rest ?? null), sets: e.sets.map(x => mkSet(x.w, x.r)) });
    n++;
  }
  if (n && S.workout.finishedAt) S.workout.finishedAt = null;
  save(); renderAll();
  toast(n ? `已帶入 ${n} 個項目，重量與次數沿用 ${relDay(s.date)}` : '這些項目都已經在今日清單中');
  return n;
}
function useSession(id) {
  const s = S.sessions.find(x => x.id === id);
  if (s) planFrom(s);
}
function addSet(exId) {
  const ex = findEx(exId); if (!ex) return;
  const last = ex.sets[ex.sets.length - 1];
  let w = '', r = '';
  if (last) { const ph = placeholderFor(ex, last); w = last.w || ph.w; r = last.r || ph.r; }
  else { const lp = lastPerf(ex.name); if (lp && lp.sets[0]) { w = lp.sets[0].w; r = lp.sets[0].r; } }
  ex.sets.push(mkSet(w, r));
  if (S.workout.finishedAt) S.workout.finishedAt = null;
  save(); renderAll();
}
function setField(exId, setId, field, value) {
  const ex = findEx(exId); if (!ex) return;
  const set = ex.sets.find(s => s.id === setId); if (!set) return;
  set[field] = value;
  save();
}
function sanitize(v, field) {
  v = String(v ?? '');
  if (field === 'w') return v.replace(',', '.').replace(/[^\d.]/g, '').replace(/(\..*)\./g, '$1').slice(0, 6);
  return v.replace(/\D/g, '').slice(0, 4);
}
function startRest(ex, set) {
  const sec = restOf(ex);
  if (sec <= 0) { S.timer = null; return; }
  const now = Date.now();
  S.timer = { start: now, end: now + sec * 1000, total: sec * 1000, exId: ex.id, setId: set.id, alerted: false };
  lastPip = null;
}
function toggleSet(exId, setId) {
  const ex = findEx(exId); if (!ex) return;
  const set = ex.sets.find(s => s.id === setId); if (!set) return;
  if (set.done) {
    set.done = false; set.doneAt = null; set.gap = null;
    if (S.timer && S.timer.setId === setId) S.timer = null;
    save(); renderAll();
    return;
  }
  const ph = placeholderFor(ex, set);
  if (!set.w && ph.w) set.w = ph.w;
  if (!set.r && ph.r) set.r = ph.r;
  const now = Date.now();
  const prev = lastDoneAt();
  set.done = true; set.doneAt = now; set.gap = prev ? Math.round((now - prev) / 1000) : null;
  S.workout.lastExId = ex.id;
  if (!S.workout.startedAt) S.workout.startedAt = now;
  if (S.workout.finishedAt) S.workout.finishedAt = null;
  const remaining = nextTarget();
  if (remaining) startRest(ex, set); else S.timer = null;
  haptic(18);
  save(); renderAll(); syncWakeLock();
  if (!remaining) toast('所有組數都完成了！', { action: '結束訓練', fn: finishWorkout, ms: 6000 });
}
function adjustRest(delta) {
  const t = S.timer; if (!t) return;
  const now = Date.now();
  if (t.alerted || t.end <= now) {
    if (delta <= 0) { S.timer = null; }
    else { t.start = now; t.end = now + delta * 1000; t.total = delta * 1000; t.alerted = false; }
  } else {
    t.end += delta * 1000;
    t.total = Math.max(1000, t.total + delta * 1000);

}

  openFocus();
}

  const left = st.total - st.done;

    openSheet({
      title: '結束訓練？',
      body: `<p style="margin:0;color:var(--text-2)">還有 ${left} 組沒有打勾，未完成的組數不會被記錄。</p>`,
      foot: `<button class="btn soft" data-act="sheet-close">繼續訓練</button><button class="btn primary" data-act="finish-now">結束並儲存</button>`,
    });

}
function finishWorkout() {

/* ---------- Export: formats ---------- */
function exportExercises() {
  const anyDone = S.workout.exercises.some(e => e.sets.some(s => s.done));
  return S.workout.exercises
    .map(ex => ({ name: ex.name, sets: ex.sets.filter(s => anyDone ? s.done : (s.w || s.r)) }))
    .filter(ex => ex.sets.length);
}
// Today's workout in the same shape as a history session (completed sets, or the plan if nothing is done yet).
function workoutAsSession() {
  const w = S.workout;
  return {
    id: w.id, date: w.date, startedAt: w.startedAt,
    finishedAt: w.finishedAt || (w.startedAt ? (lastDoneAt() || null) : null),
    exercises: exportExercises().map(e => ({ name: e.name, sets: e.sets.map(x => ({ w: x.w, r: x.r, doneAt: x.doneAt, gap: x.gap })) })),
  };
}
function sessionDur(s) { return s.startedAt && s.finishedAt && s.finishedAt > s.startedAt ? (s.finishedAt - s.startedAt) / 1000 : 0; }
function groupSets(sets) {
  const out = [];
  for (const x of sets) {
    const g = out[out.length - 1];
    if (g && g.w === x.w && g.r === x.r) g.n++; else out.push({ w: x.w, r: x.r, n: 1 });
  }
  return out;
}
function dateWithDay(iso) { const d = parseDay(iso); return d ? `${iso}（週${'日一二三四五六'[d.getDay()]}）` : iso; }
function summaryLine(s) {

  return [dur ? fmtDur(dur) : '', `${st.sets} 組`, `總量 ${fmtVol(st.vol)} kg`, `${s.exercises.length} 個項目`].filter(Boolean).join(' · ');
}
function mdSafe(t) { return String(t ?? '').replace(/\|/g, '\\|').replace(/\n/g, ' '); }

// Original blog format (Jekyll front matter + one table).
function toBlog(s) {
  const rows = [];
  for (const e of s.exercises) {
    const sec = unitOf(e.name) === 'sec';
    for (const g of groupSets(e.sets)) rows.push(`| ${mdSafe(e.name)} | ${mdSafe(g.w)} | ${mdSafe(g.r && sec ? `${g.r}s` : g.r)} | ${g.n} |`);
  }
  return ['---', `title: FuGym ${s.date}`, 'category: Gym', 'layout: post', `date: ${s.date}`, 'tags: []', '---', '',
    '| Exercise | Weight (kg) | Reps per Set | Sets |', '| --- | --- | --- | --- |', ...rows].join('\n');
}
// Obsidian note: properties for Dataview / Bases, a summary callout, one table per exercise.
function toObsidian(s) {
  const st = sessionStats(s), dur = sessionDur(s);
  const q = v => JSON.stringify(String(v));
  const link = n => S.settings.obsLinks ? `[[${n}]]` : n;
  const out = ['---', `date: ${s.date}`, 'type: workout'];
  if (dur) out.push(`duration_min: ${Math.round(dur / 60)}`);
  out.push(`sets: ${st.sets}`, `volume_kg: ${Math.round(st.vol)}`, 'exercises:', ...s.exercises.map(e => `  - ${q(link(e.name))}`),
    'tags:', '  - gym', '  - fugym', '---', '', `# ${s.date} 重訓紀錄`, '', `> [!summary] ${fmtDate(s.date)}`, `> ${summaryLine(s)}`);

function toText(list) {

/* ---------- Export: delivery ---------- */
async function copyText(text) {
  try { await navigator.clipboard.writeText(text); return true; } catch (e) {}
  try {
    const ta = document.createElement('textarea');
    ta.value = text; ta.style.position = 'fixed'; ta.style.opacity = '0';
    document.body.appendChild(ta); ta.select();
    const ok = document.execCommand('copy');
    ta.remove();
    return ok;
  } catch (e) { return false; }
}
function download(text, filename, mime) {
  const url = URL.createObjectURL(new Blob([text], { type: mime }));
  const a = document.createElement('a');
  a.href = url; a.download = filename;
  document.body.appendChild(a); a.click(); a.remove();
  setTimeout(() => URL.revokeObjectURL(url), 1500);
}
async function shareFile(text, filename, mime, title, asText = false) {
  try {
    if (!asText && window.File && navigator.canShare) {
      const file = new File([text], filename, { type: mime });
      if (navigator.canShare({ files: [file] })) { await navigator.share({ title, files: [file] }); return; }
    }
    if (navigator.share) { await navigator.share({ title, text }); return; }
  } catch (e) {
    if (e && e.name === 'AbortError') return;
  }
  if (await copyText(text)) toast('這個瀏覽器無法分享，已改為複製到剪貼簿');
  else download(text, filename, mime);
}

/* ---------- Import: parsers ---------- */
function splitRow(line) {
  return line.trim().replace(/\\\|/g, '\u0001').replace(/^\|/, '').replace(/\|$/, '').split('|').map(c => c.replace(/\u0001/g, '|').trim());
}
const isSepRow = c => c.every(x => !x || /^:?-{2,}:?$/.test(x));
function pickCol(head, keys) {
  for (const k of keys) { const i = head.findIndex(h => h.includes(k)); if (i >= 0) return i; }
  return -1;
}
const firstInt = v => { const m = String(v ?? '').match(/\d+/); return m ? m[0] : ''; };
const clampSets = v => Math.max(1, Math.min(30, parseInt(v, 10) || 1));
function normDate(v) {
  v = String(v || '').trim();
  if (/\d{4}-\d{2}-\d{2}T\d/.test(v)) { const t = Date.parse(v); if (!isNaN(t)) return localStamp(t).slice(0, 10); }
  const m = v.match(/(\d{4})[-/.](\d{1,2})[-/.](\d{1,2})/);
  return m ? `${m[1]}-${pad(+m[2])}-${pad(+m[3])}` : '';
}
function parseStamp(v) {
  v = String(v || '').trim();
  if (!v) return null;
  const t = Date.parse(/^\d{4}-\d{2}-\d{2} \d/.test(v) ? v.replace(' ', 'T') : v);
  return isNaN(t) ? null : t;
}
function getEx(list, name) {
  let ex = list.find(e => e.name === name);
  if (!ex) { ex = { name, rest: null, unit: null, sets: [] }; list.push(ex); }
  return ex;
}
function finishImported(s, durSec) {
  s.exercises = s.exercises.filter(e => e.sets.length);
  if (!s.startedAt && durSec) {
    const base = parseDay(s.date);
    if (base) { s.startedAt = base.getTime() + 12 * 3600e3; s.finishedAt = s.startedAt + durSec * 1000; }
  }
  return s;
}
const newImported = date => ({ id: null, date: date || todayISO(), startedAt: null, finishedAt: null, exercises: [] });

// Markdown tables that have an Exercise column (blog export, old plan export, generic tables).
function parseExerciseTable(text) {
  const lines = String(text || '').split(/\r?\n/);
  const out = [];
  const hi = lines.findIndex(l => /^\s*\|/.test(l) && /(exercise|動作|項目)/i.test(l));
  if (hi === -1) return out;
  const head = splitRow(lines[hi]).map(h => h.toLowerCase());
  const iName = pickCol(head, ['exercise', '動作', '項目']);
  const iW = pickCol(head, ['weight', '重量', 'kg']);
  const iR = pickCol(head, ['reps', '次', '秒']);
  const iSets = head.findIndex(h => /^sets?\b/.test(h) || h.includes('組數') || h === '組');
  const iRest = pickCol(head, ['rest', '休息']);
  const iNote = pickCol(head, ['note', '備註']);
  const headSec = iR >= 0 && /秒|sec/.test(head[iR]);
  for (let i = hi + 1; i < lines.length; i++) {
    const line = lines[i].trim();
    if (!line.startsWith('|')) { if (out.length) break; continue; }
    const c = splitRow(line);
    if (isSepRow(c)) continue;
    const name = String(c[iName] || '').trim();
    if (!name || name === '-') continue;
    let w = iW >= 0 ? (c[iW] || '') : '';
    if (!w && iNote >= 0) { const m = (c[iNote] || '').match(/([\d.]+)\s*kg/i); if (m) w = m[1]; }
    const rCell = iR >= 0 ? c[iR] : '';
    const rest = iRest >= 0 ? parseInt(c[iRest], 10) : NaN;
    const ex = getEx(out, name);
    if (Number.isFinite(rest)) ex.rest = rest;
    if (headSec || /秒|\ds\b/i.test(rCell)) ex.unit = 'sec';
    for (let k = 0, n = clampSets(c[iSets]); k < n; k++) ex.sets.push({ w: sanitize(w, 'w'), r: firstInt(rCell) });
  }
  return out;
}
// "## Exercise" headings each followed by a set table (FuGym Obsidian notes and similar).
function parseSectionTables(text) {
  const out = [];
  let name = null, head = null;
  for (const raw of String(text).split(/\r?\n/)) {
    const line = raw.trim();
    const h = line.match(/^#{2,6}\s+(.+)$/);
    if (h) { name = h[1].replace(/\[\[([^\]|]+)(?:\|[^\]]*)?\]\]/g, '$1').trim(); head = null; continue; }
    if (!line.startsWith('|')) { head = null; continue; }
    if (!name) continue;
    const c = splitRow(line);
    if (!head) { head = c.map(x => x.toLowerCase()); continue; }
    if (isSepRow(c)) continue;
    const iW = pickCol(head, ['weight', '重量', 'kg']);
    const iR = pickCol(head, ['reps', '次', '秒', 'sec']);
    if (iW < 0 && iR < 0) continue;
    const iN = head.findIndex(x => /^sets?\b/.test(x) || x.includes('組數'));
    const ex = getEx(out, name);
    if (iR >= 0 && /秒|sec/.test(head[iR])) ex.unit = 'sec';
    for (let k = 0, n = iN >= 0 ? clampSets(c[iN]) : 1; k < n; k++) {
      ex.sets.push({ w: iW >= 0 ? sanitize(c[iW], 'w') : '', r: iR >= 0 ? firstInt(c[iR]) : '' });
    }
  }
  return out;
}
function parseMarkdownDoc(text) {
  const fm = text.match(/^\s*---\s*\r?\n([\s\S]*?)\r?\n---/);
  let date = '', dur = 0;
  if (fm) {
    const d = fm[1].match(/^date:\s*["']?(\d{4}[-/.]\d{1,2}[-/.]\d{1,2})/m); if (d) date = normDate(d[1]);
    const m = fm[1].match(/^duration_min:\s*(\d+)/m); if (m) dur = +m[1] * 60;
  }
  if (!date) date = normDate((text.match(/\d{4}[-/.]\d{1,2}[-/.]\d{1,2}/) || [''])[0]);
  let exercises = parseExerciseTable(text);
  if (!exercises.length) exercises = parseSectionTables(text);
  if (!exercises.length) return [];
  const s = newImported(date);
  s.exercises = exercises;
  return [finishImported(s, dur)];
}
function csvRows(text) {
  const first = text.split(/\r?\n/, 1)[0];
  const delim = (first.match(/\t/g) || []).length > (first.match(/,/g) || []).length ? '\t' : ',';
  const rows = []; let row = [], field = '', q = false;
  for (let i = 0; i < text.length; i++) {
    const ch = text[i];
    if (q) {
      if (ch === '"') { if (text[i + 1] === '"') { field += '"'; i++; } else q = false; }
      else field += ch;
    } else if (ch === '"') q = true;
    else if (ch === delim) { row.push(field); field = ''; }
    else if (ch === '\n') { row.push(field); rows.push(row); row = []; field = ''; }
    else if (ch !== '\r') field += ch;
  }
  if (field || row.length) { row.push(field); rows.push(row); }

}
// FuGym CSV, the old Trainer CSV, or any sheet with date / exercise / weight / reps columns.
function parseCSV(text) {
  const rows = csvRows(text);
  if (rows.length < 2) return [];
  const head = rows[0].map(h => h.trim().toLowerCase());
  const iDate = pickCol(head, ['date', '日期']);
  const iEx = pickCol(head, ['exercise', '動作', '項目']);
  const iW = pickCol(head, ['weight', '重量', 'kg']);
  const iR = pickCol(head, ['actual_reps', 'reps', '次數', '秒數', '次']);
  const iUnit = pickCol(head, ['unit', '單位']);
  const iAt = pickCol(head, ['completed', 'done_at', '完成時間']);
  const iGap = pickCol(head, ['since_prev', 'interval', 'rest_seconds']);
  const iSess = pickCol(head, ['session', '場次']);
  const iSets = head.findIndex(h => h === 'sets' || h === '組數');
  if (iEx < 0) return [];
  const groups = new Map();
  for (const c of rows.slice(1)) {
    const name = String(c[iEx] || '').trim();
    if (!name) continue;
    const rawDate = iDate >= 0 ? c[iDate] : '';
    const date = normDate(rawDate) || todayISO();
    const sid = iSess >= 0 ? String(c[iSess] || '').trim() : '';
    const key = sid ? `s:${sid}` : `d:${date}`;
    let g = groups.get(key);
    if (!g) { g = newImported(date); g.id = sid || null; groups.set(key, g); }
    const ex = getEx(g.exercises, name);
    const at = parseStamp(iAt >= 0 ? c[iAt] : '') ?? (/T\d/.test(rawDate) ? parseStamp(rawDate) : null);
    const gapRaw = iGap >= 0 ? String(c[iGap] || '').trim() : '';
    const gap = gapRaw && !isNaN(+gapRaw) ? +gapRaw : null;
    if (/sec|秒/i.test(iUnit >= 0 ? c[iUnit] : '') || (iR >= 0 && /秒/.test(head[iR]))) ex.unit = 'sec';
    for (let k = 0, n = iSets >= 0 ? clampSets(c[iSets]) : 1; k < n; k++) {
      ex.sets.push({ w: sanitize(iW >= 0 ? c[iW] : '', 'w'), r: firstInt(iR >= 0 ? c[iR] : ''), doneAt: at, gap });
    }
    if (at) { g.startedAt = Math.min(g.startedAt ?? at, at); g.finishedAt = Math.max(g.finishedAt ?? at, at); }

}
// One set line, e.g. "100 kg × 5 次 × 3 組", "100x5x3", "60 秒 × 3 組", "8 次".
function matchSet(line) {
  const t = line.replace(/[×xX＊*]/g, ' x ').replace(/公斤/g, 'kg').replace(/\s+/g, ' ').trim();
  const U = '(次|下|秒|s|sec|reps?)';
  const N = '(?:\\s*x\\s*(\\d+)\\s*(?:組|sets?)?)?';
  let m;
  if ((m = t.match(new RegExp(`^([\\d.]+)\\s*kg\\s*x\\s*(\\d+)\\s*${U}?${N}$`, 'i')))) return { w: m[1], r: m[2], sec: /秒|^s/i.test(m[3] || ''), n: m[4] };
  if ((m = t.match(new RegExp(`^([\\d.]+)\\s*x\\s*(\\d+)\\s*${U}?${N}$`, 'i')))) return { w: m[1], r: m[2], sec: /秒|^s/i.test(m[3] || ''), n: m[4] };
  if ((m = t.match(new RegExp(`^(\\d+)\\s*${U}${N}$`, 'i')))) return { w: '', r: m[1], sec: /秒|^s/i.test(m[2]), n: m[3] };
  if ((m = t.match(/^([\d.]+)\s*kg(?:\s*x\s*(\d+)\s*(?:組|sets?))?$/i))) return { w: m[1], r: '', sec: false, n: m[2] };
  if ((m = t.match(/^完成(?:\s*x\s*(\d+)\s*組)?$/))) return { w: '', r: '', sec: false, n: m[1] };

}
function parseDurText(line) {
  let m = line.match(/(\d+)\s*小時\s*(\d+)\s*分/);
  if (m) return +m[1] * 3600 + +m[2] * 60;
  m = line.match(/(\d+)\s*分/);

}
// FuGym text log, or hand-written notes ("槓鈴深蹲" then "100x5x3", or "槓鈴深蹲 100kg×5×3").
function parseText(text) {
  const sessions = [];
  let cur = null, ex = null, dur = 0;
  const close = () => { if (cur) finishImported(cur, dur); };
  const open = date => { close(); cur = newImported(date); sessions.push(cur); ex = null; dur = 0; };
  const addSets = (target, st) => {
    if (st.sec) target.unit = 'sec';
    for (let k = 0, n = st.n ? clampSets(st.n) : 1; k < n; k++) target.sets.push({ w: sanitize(st.w, 'w'), r: st.r });
  };
  for (const raw of String(text).split(/\r?\n/)) {

    if (dm && !matchSet(line)) { open(normDate(dm[0])); continue; }
    if (/總量|訓練時間/.test(line)) { const d = parseDurText(line); if (d) dur = d; continue; }

    const st = matchSet(body);
    if (st) {
      if (!cur) open('');
      if (!ex) ex = getEx(cur.exercises, '未命名項目');
      addSets(ex, st);
      continue;
    }
    const inl = body.match(/^(.*?[^\d\s.:：])[\s:：]+([\d.]+.*)$/);

    if (st2) {
      if (!cur) open('');
      ex = getEx(cur.exercises, inl[1].trim());
      addSets(ex, st2);
      continue;
    }

}
function parseImport(text) {
  const t = String(text || '').replace(/^﻿/, '').trim();
  if (!t) return null;
  if (t[0] === '{') {
    try {
      const d = JSON.parse(t);
      const data = d && (d.data || d);

    } catch (e) {}

    }
  }

/* ---------- Import: apply ---------- */
function sessionSig(s) {
  return `${s.date}|${s.exercises.map(e => `${norm(e.name)}:${e.sets.map(x => `${x.w}x${x.r}`).join(',')}`).join(';')}`;
}
function isDupSession(s) {
  const sig = sessionSig(s);
  return S.sessions.some(x => (s.id && x.id === s.id) || sessionSig(x) === sig);
}
function registerNames(exercises) {
  for (const e of exercises) {
    if (!BUILTIN.has(norm(e.name)) && !S.custom.some(c => norm(c.name) === norm(e.name))) S.custom.push({ name: e.name, cat: '自訂' });
    if (e.unit === 'sec' && unitOf(e.name) !== 'sec') S.units[norm(e.name)] = 'sec';
  }
}
function undoToast(msg, snap) {
  toast(msg, { action: '復原', ms: 6000, fn: () => { S = normalize(JSON.parse(snap)); save(); renderAll(); syncWakeLock(); } });
}
function importSessions(list) {
  const snap = JSON.stringify(S);
  let added = 0, skipped = 0;
  for (const s of list) {
    if (!s.exercises.length) continue;
    if (isDupSession(s)) { skipped++; continue; }
    const id = s.id && s.id !== S.workout.id && !S.sessions.some(x => x.id === s.id) ? String(s.id) : uid();
    S.sessions.push({
      id, date: s.date, startedAt: s.startedAt || null, finishedAt: s.finishedAt || null,
      exercises: s.exercises.map(e => ({ name: e.name, rest: e.rest ?? null, sets: e.sets.map(x => ({ w: String(x.w ?? ''), r: String(x.r ?? ''), doneAt: x.doneAt ?? null, gap: x.gap ?? null })) })),
    });
    registerNames(s.exercises);
    added++;
  }
  sortSessions(); save(); renderAll();
  undoToast(`已匯入 ${added} 次訓練${skipped ? `，略過 ${skipped} 筆重複` : ''}`, snap);
}
function mergeBackup(data) {
  const snap = JSON.stringify(S);
  const inc = normalize(data);
  let added = 0, skipped = 0;
  for (const s of inc.sessions) {
    if (isDupSession(s)) { skipped++; continue; }
    S.sessions.push(s.id === S.workout.id || !s.id ? Object.assign({}, s, { id: uid() }) : s);
    added++;
  }
  for (const c of inc.custom) if (!S.custom.some(x => norm(x.name) === norm(c.name))) S.custom.push(c);
  S.restPrefs = Object.assign({}, inc.restPrefs, S.restPrefs);
  S.units = Object.assign({}, inc.units, S.units);
  sortSessions(); save(); renderAll();
  undoToast(`已合併 ${added} 次訓練${skipped ? `，略過 ${skipped} 筆重複` : ''}`, snap);
}
function replaceAll(data) {
  const snap = JSON.stringify(S);
  S = normalize(data);
  S.timer = null;
  closeFocus();
  save(); renderAll(); syncWakeLock();
  undoToast('已用備份取代所有資料', snap);
}
function importAsPlan(s) {
  registerNames(s.exercises);
  planFrom(s);
}

/* ---------- Import: sheet ---------- */

  const readFile = file => { const r = new FileReader(); r.onload = () => { ta.value = String(r.result || ''); analyze(); }; r.readAsText(file); };
  ta.addEventListener('input', () => { clearTimeout(timer); timer = setTimeout(analyze, 180); });
  $('#importFile').addEventListener('change', e => { if (e.target.files[0]) readFile(e.target.files[0]); });
  const sheet = $('#layer .sheet');
  sheet.addEventListener('dragover', e => { e.preventDefault(); ta.style.boxShadow = 'inset 0 0 0 2px var(--accent)'; });
  sheet.addEventListener('dragleave', () => { ta.style.boxShadow = ''; });
  sheet.addEventListener('drop', e => {

    const f = e.dataTransfer.files && e.dataTransfer.files[0];

function renderImportPreview() {

      : dups ? `其中 ${dups} 次已經在訓練歷史中，會自動略過。` : '加入訓練歷史後，下次新增同樣的項目會自動帶入這些重量與次數。'}</p>`;

function runImport() {
  const p = imp.parsed;
  if (!p || p.kind === 'error') return;
  closeSheet();
  if (p.kind === 'backup') { if (imp.dest === 'replace') replaceAll(p.data); else mergeBackup(p.data); }
  else if (imp.dest === 'plan') importAsPlan(p.sessions[p.sessions.length - 1]);
  else importSessions(p.sessions);
}

/* ---------- Timer loop ---------- */
let lastPip = null;
function onRestEnd() {
  tone(880, 0.16, 0); tone(880, 0.16, 0.22); tone(1320, 0.34, 0.44);
  haptic([260, 120, 260]);
  document.title = '⏰ 休息結束 · FuGym';
}
function paintTimer(now) {
  const t = S.timer; if (!t) return;
  const rem = (t.end - now) / 1000;
  const over = rem <= 0;
  const txt = over ? `+${fmtRest(-rem)}` : fmtRest(Math.ceil(rem));
  const p = over ? 1 : Math.max(0, Math.min(1, rem * 1000 / t.total));
  const bar = $('#restBar');
  if (bar) {
    bar.classList.toggle('over', over);
    $('#restTime').textContent = txt;
    $('#restLabel').textContent = over ? '休息結束 · 開始下一組' : '組間休息';
    $('#restFill').style.transform = `scaleX(${p})`;
  }
  const f = $('#focus');
  if (focusOpen && $('#fTime') && f.classList.contains('resting')) {
    f.classList.toggle('over', over);
    $('#fTime').textContent = txt;
    $('#fLabel').textContent = over ? '休息結束' : '組間休息';
    setRing(p);
  }
}
function setRing(p) {
  const bar = $('#ringBar'); if (!bar) return;
  const C = 2 * Math.PI * 96;
  bar.style.strokeDasharray = `${C}`;
  bar.style.strokeDashoffset = `${C * (1 - p)}`;
}
function paintGap(now) {
  const el = $('#fGap'); if (!el) return;
  const t = lastDoneAt() || S.workout.startedAt;
  if (t) el.textContent = fmtRest((now - t) / 1000);
}
function tick() {
  const now = Date.now();
  if (S.workout.startedAt && !S.workout.finishedAt) paintElapsed(now);
  const t = S.timer;
  if (t) {
    const rem = (t.end - now) / 1000;
    if (rem <= 0 && !t.alerted) { t.alerted = true; onRestEnd(); save(); }
    else if (rem > 0 && rem <= 3) {
      const s = Math.ceil(rem);
      if (s !== lastPip) { lastPip = s; tone(660, 0.07, 0, 0.12); }
    }
    if (rem < -600) { S.timer = null; save(); renderDock(); renderFocus(); }
    else paintTimer(now);
  }
  if (focusOpen && !S.timer) paintGap(now);
}

/* ---------- Exercise picker ---------- */
const picker = { q: '', cat: 'all', sel: [] };
function openPicker() {
  picker.q = ''; picker.sel = [];
  picker.cat = recentNames().length ? 'recent' : 'all';
  openSheet({
    title: '選擇項目',
    cls: 'tall',
    raw: true,
    body: `
      <div class="search">${ic('search')}<input id="pickerQ" type="search" placeholder="搜尋，或輸入新項目名稱" autocomplete="off" enterkeyhint="done" aria-label="搜尋項目" /></div>
      <div class="cat-row" id="pickerCats"></div>
      <div class="sheet-body" id="pickerList"></div>`,
    foot: `<button class="btn primary block lg" data-act="picker-confirm" id="pickerConfirm" disabled>選擇項目</button>`,
  });
  renderPicker();
}
function pickRow(name, today) {
  const sel = picker.sel.includes(name);
  const last = lastPerf(name);
  const p = presetOf(name);
  const hint = last ? `上次 ${perfSummary(last.sets, unitOf(name))} · ${relDay(last.date)}`
    : p ? `建議 ${p.sets} 組 × ${p.reps}${p.unit === 'sec' ? ' 秒' : ' 次'} · 休息 ${fmtRest(p.rest)}` : '';
  const sub = [catOf(name), hint].filter(Boolean).join(' · ');
  return `
    <button class="pick-row${sel ? ' sel' : ''}" data-act="picker-toggle" data-name="${esc(name)}" aria-pressed="${sel}">
      <span class="pick-check">${ic('check')}</span>
      <span class="pick-main"><span class="pick-name">${esc(name)}</span><span class="pick-sub">${esc(sub)}</span></span>
      ${today.has(norm(name)) ? '<span class="tag">已在今日</span>' : ''}
    </button>`;
}
function renderPicker() {
  const cats = $('#pickerCats'), list = $('#pickerList');
  if (!cats || !list) return;
  const recent = recentNames();
  const custom = customNames();
  const catList = [...(recent.length ? [['recent', '最近']] : []), ['all', '全部'], ...CATS.map(c => [c, c]), ['custom', '自訂']];
  cats.hidden = !!picker.q;
  cats.innerHTML = catList.map(([k, l]) => `<button class="chip ${picker.cat === k ? 'on' : ''}" data-act="picker-cat" data-cat="${k}">${l}</button>`).join('');
  const today = new Set(S.workout.exercises.map(e => norm(e.name)));
  const q = norm(picker.q);
  let html = '';
  if (q) {
    const names = allNames();
    const matches = names.filter(n => norm(n).includes(q));
    if (!names.some(n => norm(n) === q)) {
      html += `<button class="pick-row add" data-act="picker-add-custom"><span class="pick-check">${ic('plus')}</span><span class="pick-main"><span class="pick-name">新增「${esc(picker.q.trim())}」</span><span class="pick-sub">加入自訂項目並選取</span></span></button>`;
    }
    html += matches.map(n => pickRow(n, today)).join('');
  } else if (picker.cat === 'recent') {
    html = `<div class="pick-group">最近做過</div>` + recent.map(n => pickRow(n, today)).join('');
  } else if (picker.cat === 'all') {
    for (const c of CATS) {
      const extra = custom.filter(n => catOf(n) === c);
      html += `<div class="pick-group">${c}</div>` + [...LIBRARY[c], ...extra].map(n => pickRow(n, today)).join('');
    }
    const rest = custom.filter(n => !CATS.includes(catOf(n)));
    if (rest.length) html += `<div class="pick-group">自訂</div>` + rest.map(n => pickRow(n, today)).join('');
  } else if (picker.cat === 'custom') {
    html = custom.length ? custom.map(n => pickRow(n, today)).join('') : `<p class="pick-empty">還沒有自訂項目。<br>在上方搜尋欄輸入名稱，就能新增。</p>`;
  } else {
    const extra = custom.filter(n => catOf(n) === picker.cat);
    html = [...(LIBRARY[picker.cat] || []), ...extra].map(n => pickRow(n, today)).join('');
  }
  list.innerHTML = html || `<p class="pick-empty">找不到符合的項目</p>`;
  updatePickerBtn();
}
function updatePickerBtn() {
  const b = $('#pickerConfirm'); if (!b) return;
  const n = picker.sel.length;
  b.disabled = !n;
  b.textContent = n ? `加入 ${n} 個項目` : '選擇項目';
}
function togglePick(name, el) {
  const i = picker.sel.indexOf(name);
  if (i >= 0) picker.sel.splice(i, 1); else picker.sel.push(name);
  if (el) { el.classList.toggle('sel', i < 0); el.setAttribute('aria-pressed', String(i < 0)); }
  haptic(8);
  updatePickerBtn();
}
function addCustomFromQuery() {
  const name = picker.q.trim();
  if (!name) return;
  const existing = allNames().find(n => norm(n) === norm(name));
  const finalName = existing || name;
  if (!existing) S.custom.push({ name, cat: CATS.includes(picker.cat) ? picker.cat : '自訂' });
  if (!picker.sel.includes(finalName)) picker.sel.push(finalName);
  picker.q = '';
  const inp = $('#pickerQ'); if (inp) inp.value = '';
  save();
  renderPicker();
}
function confirmPicker() {
  const names = picker.sel.slice();
  if (!names.length) return;
  closeSheet();
  const added = addExercises(names);
  toast(`已加入 ${added.length} 個項目`);
  const first = added[0] && document.getElementById(`ex-${added[0].id}`);
  if (first) first.scrollIntoView({ behavior: 'smooth', block: 'center' });
}

/* ---------- Focus (training) mode ---------- */
let focusOpen = false;
let focusExId = null;
function focusTarget() {
  const ex = findEx(focusExId);
  if (ex) return { ex, set: ex.sets.find(s => !s.done) || null };
  return nextTarget();
}
function openFocus() {
  if (!S.workout.exercises.length) return;
  const n = nextTarget();
  focusExId = n ? n.ex.id : S.workout.exercises[S.workout.exercises.length - 1].id;
  focusOpen = true;
  hideToast();
  $('#focus').classList.add('open');
  document.body.classList.add('lock');
  renderFocus();
}
function closeFocus() {
  if (!focusOpen) return;
  focusOpen = false;
  const f = $('#focus');
  f.classList.remove('open', 'resting', 'over');
  f.innerHTML = '';
  if (!sheetOpen()) document.body.classList.remove('lock');
  renderList();
}
function moveFocus(d) {
  const list = S.workout.exercises;
  const i = list.findIndex(e => e.id === focusExId);
  const j = Math.max(0, Math.min(list.length - 1, i + d));
  focusExId = list[j].id;
  renderFocus();
}
function renderFocus() {
  if (!focusOpen) return;
  const f = $('#focus'), w = S.workout, list = w.exercises;
  if (!list.length) { closeFocus(); return; }
  let t = focusTarget();
  if (!t) t = { ex: list[list.length - 1], set: null };
  const { ex, set } = t;
  focusExId = ex.id;
  const exIdx = list.indexOf(ex);
  const setIdx = set ? ex.sets.indexOf(set) : -1;
  const resting = !!S.timer;
  const anyLeft = !!nextTarget();
  const doneCount = ex.sets.filter(s => s.done).length;
  const ph = set ? placeholderFor(ex, set) : { w: '', r: '' };
  const last = lastPerf(ex.name);
  const ls = set && last ? last.sets[setIdx] : null;
  const unit = unitOf(ex.name), sec = unit === 'sec';
  const since = lastDoneAt() || w.startedAt;

  let center;
  if (resting) {
    center = `<span class="ring-label" id="fLabel">組間休息</span><span class="ring-time" id="fTime">0:00</span><span class="ring-sub num">共 ${fmtRest(S.timer.total / 1000)}</span>`;
  } else if (set) {
    center = since
      ? `<span class="ring-label">第 ${setIdx + 1} / ${ex.sets.length} 組</span><span class="ring-time" id="fGap">0:00</span><span class="ring-sub">距離上一組</span>`
      : `<span class="ring-label">第 ${setIdx + 1} / ${ex.sets.length} 組</span><span class="ring-time word">準備</span><span class="ring-sub">完成後按下方按鈕</span>`;
  } else {
    center = `<span class="ring-label">${anyLeft ? '此項目完成' : '全部完成'}</span><span class="ring-time">${ic('check')}</span><span class="ring-sub num">${doneCount} 組 · ${fmtVol(ex.sets.filter(s => s.done).reduce((a, s) => a + num(s.w) * num(s.r), 0))} kg</span>`;
  }

  let cta;
  if (set) cta = `<button class="btn primary block" data-act="focus-done">${ic('check')}完成第 ${setIdx + 1} 組</button>`;
  else if (anyLeft) cta = `<button class="btn primary block" data-act="focus-goto-next">下一個項目${ic('right')}</button><button class="btn soft block" data-act="focus-add-set">${ic('plus')}這個項目再加一組</button>`;
  else cta = `<button class="btn primary block" data-act="finish">${ic('flag')}結束訓練並儲存</button><button class="btn soft block" data-act="focus-add-set">${ic('plus')}再加一組</button>`;

  f.classList.toggle('resting', resting);
  f.classList.remove('over');
  f.innerHTML = `
    <div class="focus-inner" data-ex="${ex.id}">
      <div class="focus-top">
        <button class="icon-btn" data-act="focus-close" aria-label="收起訓練模式">${ic('down')}</button>
        <div class="focus-title"><small class="num">項目 ${exIdx + 1} / ${list.length}${w.startedAt ? ` · <span id="fElapsed">${fmtClock((Date.now() - w.startedAt) / 1000)}</span>` : ''}</small></div>
        <button class="end-btn" data-act="finish">結束</button>
      </div>
      <div class="focus-ex">
        <button class="icon-btn" data-act="focus-prev" ${exIdx === 0 ? 'disabled' : ''} aria-label="上一個項目">${ic('left')}</button>
        <h2>${esc(ex.name)}</h2>
        <button class="icon-btn" data-act="focus-next" ${exIdx === list.length - 1 ? 'disabled' : ''} aria-label="下一個項目">${ic('right')}</button>
      </div>
      <div class="dots" aria-hidden="true">${ex.sets.map(s => `<i class="dot${s.done ? ' done' : ''}${s === set ? ' cur' : ''}"></i>`).join('')}</div>
      <div class="ring-wrap">
        <svg class="ring${resting ? '' : ' idle'}" viewBox="0 0 220 220" aria-hidden="true">
          <circle class="track" cx="110" cy="110" r="96" />
          <circle class="bar" id="ringBar" cx="110" cy="110" r="96" />
        </svg>
        <div class="ring-center" aria-live="off">${center}</div>
      </div>
      ${resting ? `
        <div class="rest-ctrls">
          <button class="pill" data-act="rest-minus">−15 秒</button>
          <button class="pill accent" data-act="rest-skip">跳過休息</button>
          <button class="pill" data-act="rest-plus">+15 秒</button>
        </div>` : ''}
      ${set ? `
        <div class="stepper-label-row">${resting ? '下一組' : '這一組'}</div>
        <div class="steppers" data-set="${set.id}">
          <div class="stepper">
            <div class="stepper-label">重量 kg</div>
            <div class="stepper-row">
              <button data-act="step" data-field="w" data-dir="-1" aria-label="減少重量">${ic('minus')}</button>
              <input class="focus-in" data-field="w" type="text" inputmode="decimal" autocomplete="off" value="${esc(set.w)}" placeholder="${esc(ph.w || (isBw(ex.name) ? '自重' : '0'))}" aria-label="重量（公斤）" />
              <button data-act="step" data-field="w" data-dir="1" aria-label="增加重量">${ic('plus')}</button>
            </div>
          </div>
          <div class="stepper">
            <div class="stepper-label">${sec ? '秒數' : '次數'}</div>
            <div class="stepper-row">
              <button data-act="step" data-field="r" data-dir="-1" aria-label="減少${sec ? '秒數' : '次數'}">${ic('minus')}</button>
              <input class="focus-in" data-field="r" type="text" inputmode="numeric" autocomplete="off" value="${esc(set.r)}" placeholder="${esc(ph.r || '0')}" aria-label="${sec ? '秒數' : '次數'}" />
              <button data-act="step" data-field="r" data-dir="1" aria-label="增加${sec ? '秒數' : '次數'}">${ic('plus')}</button>
            </div>
          </div>
        </div>
        <p class="focus-hint">${ls ? `上次這一組：${esc(setText(ls.w, ls.r, unit))} · ${esc(relDay(last.date))}` : `組間休息 ${restOf(ex) ? fmtRest(restOf(ex)) : '不計時'}，可在項目選單調整`}</p>` : ''}
      <div class="focus-cta">${cta}</div>
    </div>`;
  if (resting) paintTimer(Date.now());
  else { setRing(ex.sets.length ? doneCount / ex.sets.length : 0); paintGap(Date.now()); }
}
function focusDone() {
  const t = focusTarget();
  if (!t || !t.set) return;
  const ex = t.ex;
  toggleSet(ex.id, t.set.id);
  if (!ex.sets.some(s => !s.done)) {
    const n = nextTarget();
    if (n) focusExId = n.ex.id;
  }
  renderFocus();
}
function step(field, dir) {
  const t = focusTarget();
  if (!t || !t.set) return;
  const ph = placeholderFor(t.ex, t.set);
  const base = num(t.set[field] !== '' ? t.set[field] : ph[field]);
  const inc = field === 'w' ? S.settings.step : (unitOf(t.ex.name) === 'sec' ? 5 : 1);
  const next = Math.max(0, Math.round((base + dir * inc) * 100) / 100);
  t.set[field] = field === 'w' ? fmtW(next) : String(Math.round(next));
  haptic(6);
  save();
  const inp = $(`.focus-in[data-field="${field}"]`);
  if (inp) inp.value = t.set[field];
  renderDock();
}

  'copy-text': async () => { const t = toText([workoutAsSession()]); toast(await copyText(t) ? '文字紀錄已複製' : '複製失敗'); },

  'menu': () => openMenu(),

  'settings-step': ({ el }) => { S.settings.step = +el.dataset.v; save(); $$('[data-act="settings-step"]').forEach(c => c.classList.toggle('on', c === el)); },

  'ex-menu': ({ exId }) => openExMenu(exId),

  'rename-save': ({ exId }) => saveRename(exId),
  'ex-up': ({ exId }) => moveEx(exId, -1),
  'ex-down': ({ exId }) => moveEx(exId, 1),
  'ex-delete': ({ exId }) => deleteEx(exId),
  'set-rest': ({ exId, el }) => setRest(exId, +el.dataset.sec),
  'add-set': ({ exId }) => addSet(exId),

  'set-dup': ({ exId, setId }) => {
    const ex = findEx(exId); if (!ex) return;
    const i = ex.sets.findIndex(s => s.id === setId); if (i < 0) return;
    const ph = placeholderFor(ex, ex.sets[i]);
    ex.sets.splice(i + 1, 0, mkSet(ex.sets[i].w || ph.w, ex.sets[i].r || ph.r));
    if (S.workout.finishedAt) S.workout.finishedAt = null;
    closeSheet(); save(); renderAll();
  },
  'set-undone': ({ exId, setId }) => { closeSheet(); toggleSet(exId, setId); },
  'set-delete': ({ exId, setId }) => {
    const ex = findEx(exId); if (!ex) return;
    const i = ex.sets.findIndex(s => s.id === setId); if (i < 0) return;
    closeSheet();
    withUndo(`已刪除 ${ex.name} 第 ${i + 1} 組`, () => {
      ex.sets.splice(i, 1);
      if (S.timer && S.timer.setId === setId) S.timer = null;
    });
  },
  'use-prev': ({ exId, setId }) => {
    const ex = findEx(exId); if (!ex) return;
    const i = ex.sets.findIndex(s => s.id === setId);
    const p = prevSetOf(ex, i); if (!p) return;
    ex.sets[i].w = p.w || ''; ex.sets[i].r = p.r || '';
    haptic(8); save(); renderAll();
  },
  'toggle': ({ exId, setId }) => toggleSet(exId, setId),
  'start': () => startWorkout(),
  'open-focus': () => openFocus(),
  'rest-minus': () => adjustRest(-15),
  'rest-plus': () => adjustRest(15),
  'rest-skip': () => skipRest(),
  'finish': () => { closeSheet(); confirmFinish(); },
  'finish-now': () => { closeSheet(); finishWorkout(); },
  'summary': () => openSummary(),
  'new-workout': () => { closeSheet(); newWorkout(); },
  'focus-close': () => closeFocus(),
  'focus-prev': () => moveFocus(-1),
  'focus-next': () => moveFocus(1),
  'focus-goto-next': () => { const n = nextTarget(); if (n) { focusExId = n.ex.id; renderFocus(); } },
  'focus-add-set': () => { addSet(focusExId); },
  'focus-done': () => focusDone(),
  'step': ({ el }) => step(el.dataset.field, +el.dataset.dir),
  'picker-cat': ({ el }) => { picker.cat = el.dataset.cat; renderPicker(); $('#pickerList').scrollTop = 0; },
  'picker-toggle': ({ el }) => togglePick(el.dataset.name, el),
  'picker-add-custom': () => addCustomFromQuery(),
  'picker-confirm': () => confirmPicker(),
};

document.addEventListener('click', e => {
  const el = e.target.closest('[data-act]');
  if (!el || el.disabled) return;
  const fn = ACTIONS[el.dataset.act];
  if (!fn) return;
  e.preventDefault();
  const exEl = el.closest('[data-ex]'), setEl = el.closest('[data-set]');
  fn({ el, exId: exEl && exEl.dataset.ex, setId: setEl && setEl.dataset.set });
});

document.addEventListener('input', e => {
  const el = e.target;
  if (el.matches('.set-in, .focus-in')) {
    const exEl = el.closest('[data-ex]'), setEl = el.closest('[data-set]');
    if (!exEl || !setEl) return;
    const v = sanitize(el.value, el.dataset.field);
    if (v !== el.value) el.value = v;
    setField(exEl.dataset.ex, setEl.dataset.set, el.dataset.field, v);
    renderStats();
    renderDock();
  } else if (el.id === 'pickerQ') {
    picker.q = el.value;
    renderPicker();
  }
});

document.addEventListener('change', e => {
  const el = e.target;
  if (el.matches('.switch[data-setting]')) {
    S.settings[el.dataset.setting] = el.checked;
    save(); syncWakeLock();
    if (el.dataset.setting === 'obsLinks') renderExport();
  } else if (el.id === 'dateInput') {
    if (el.value) { S.workout.date = el.value; save(); renderAll(); }
  }
});

// Select contents on focus so a new number can be typed right away.
document.addEventListener('focusin', e => {
  if (e.target.matches('.set-in, .focus-in')) {
    const el = e.target;
    setTimeout(() => { try { el.select(); } catch (err) {} }, 0);
    if (el.matches('.set-in')) document.body.classList.add('typing');
  }
});
document.addEventListener('focusout', e => {
  if (e.target.matches('.set-in')) {
    setTimeout(() => { if (!document.activeElement || !document.activeElement.matches('.set-in')) document.body.classList.remove('typing'); }, 50);
  }
  if (e.target.matches('.focus-in')) renderDock();
});

document.addEventListener('keydown', e => {
  const t = e.target;
  if (e.key === 'Escape') {
    if (sheetOpen()) closeSheet();
    else if (focusOpen) closeFocus();
    return;
  }
  if (e.key !== 'Enter') return;
  if (t.matches('.set-in')) {
    e.preventDefault();
    const inputs = $$('.set-in');
    const next = inputs[inputs.indexOf(t) + 1];
    if (next) next.focus(); else t.blur();
  } else if (t.matches('.focus-in')) {
    e.preventDefault(); t.blur();
  } else if (t.id === 'pickerQ') {
    e.preventDefault();
    const q = norm(picker.q);
    if (!q) return;
    const exact = allNames().find(n => norm(n) === q);
    if (exact) {
      if (!picker.sel.includes(exact)) picker.sel.push(exact);
      picker.q = ''; t.value = ''; renderPicker();
    } else addCustomFromQuery();
  } else if (t.id === 'renameInput') {
    e.preventDefault();
    const exEl = t.closest('[data-ex]');
    if (exEl) saveRename(exEl.dataset.ex);
  }
});

document.addEventListener('visibilitychange', () => {
  if (document.visibilityState === 'visible') { tick(); }
  syncWakeLock();
});

/* ---------- Boot ---------- */
(function boot() {
  $('#brandMark').innerHTML = ic('dumbbell');
  $('#menuBtn').innerHTML = ic('more');
  $('#dateIcon').innerHTML = ic('cal');
  const today = todayISO();
  const w = S.workout;
  if (w.finishedAt && w.date !== today) S.workout = freshWorkout();
  else if (!w.startedAt && w.date < today) w.date = today;
  if (S.timer && (!findEx(S.timer.exId) || Date.now() - S.timer.end > 600000)) S.timer = null;
  save();
  renderAll();
  syncWakeLock();
  setInterval(tick, 250);
})();
</script>
</body>
</html>
